<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="atmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="b" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#atmBg)" />

  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Ambient light -->
  <circle cx="600" cy="300" r="220" fill="url(#emeraldGrad)" opacity="0.1" filter="url(#glow)" />

  <!-- Terminal Window Shell -->
  <rect x="160" y="80" width="880" height="515" rx="16" fill="#050811" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Terminal Header -->
  <rect x="160" y="80" width="880" height="46" rx="16" fill="#0b1120" />
  <circle cx="195" cy="103" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="217" cy="103" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="239" cy="103" r="6" fill="#10b981" opacity="0.8" />
  <text x="275" y="107" fill="#64748b" font-family="monospace" font-size="13">atm-banking-system / build / main.cpp [C++]</text>
  <rect x="910" y="92" width="105" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" />
  <text x="926" y="107" fill="#6ee7b7" font-family="monospace" font-size="11">C++ SYSTEM</text>

  <!-- Terminal Screen Content -->
  <g transform="translate(200, 150)">
    <text x="0" y="24" fill="#64748b" font-family="monospace" font-size="14">$ g++ -std=c++17 main.cpp -o atm_system &amp;&amp; ./atm_system</text>
    
    <!-- Banner -->
    <rect x="0" y="45" width="800" height="75" rx="8" fill="#091322" stroke="rgba(56,189,248,0.2)" />
    <text x="25" y="75" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="16">================= SECURE ATM BANKING SIMULATOR =================</text>
    <text x="25" y="100" fill="#94a3b8" font-family="monospace" font-size="13">[Session Initiated: Account #9402-1823 | Status: AUTHENTICATED]</text>

    <!-- Menu / Features Grid -->
    <g transform="translate(0, 140)">
      <!-- Left: Interactive Menu -->
      <rect width="380" height="250" rx="10" fill="#080e1c" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="32" fill="#e2e8f0" font-family="monospace" font-weight="600" font-size="14">&gt; SELECT TRANSACTION:</text>
      
      <rect x="18" y="50" width="344" height="38" rx="6" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" />
      <text x="32" y="74" fill="#10b981" font-family="monospace" font-size="13">[1] Check Current Balance (PKR)</text>

      <rect x="18" y="96" width="344" height="38" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" />
      <text x="32" y="120" fill="#cbd5e1" font-family="monospace" font-size="13">[2] Deposit Funds (Instant Credit)</text>

      <rect x="18" y="142" width="344" height="38" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" />
      <text x="32" y="166" fill="#cbd5e1" font-family="monospace" font-size="13">[3] Cash Withdrawal (PIN verified)</text>

      <rect x="18" y="188" width="344" height="38" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" />
      <text x="32" y="212" fill="#cbd5e1" font-family="monospace" font-size="13">[4] Detailed Audit History &amp; Exit</text>

      <!-- Right: Real-time Account State -->
      <g transform="translate(410, 0)">
        <rect width="390" height="250" rx="10" fill="#080e1c" stroke="rgba(59,130,246,0.2)" />
        <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-weight="600" font-size="14">&gt; ACCOUNT AUDIT LOG:</text>
        
        <rect x="20" y="50" width="350" height="60" rx="8" fill="#0d182e" />
        <text x="35" y="74" fill="#94a3b8" font-family="monospace" font-size="11">AVAILABLE BALANCE</text>
        <text x="35" y="98" fill="#34d399" font-family="monospace" font-weight="700" font-size="18">PKR 75,400.00</text>

        <text x="25" y="135" fill="#64748b" font-family="monospace" font-size="12">[Recent Ledger Entries]:</text>
        <text x="25" y="160" fill="#a1a1aa" font-family="monospace" font-size="12">&bull; TX_0921: +PKR 15,000 (Deposit OK)</text>
        <text x="25" y="185" fill="#a1a1aa" font-family="monospace" font-size="12">&bull; TX_0922: -PKR 5,000 (ATM Cash OK)</text>
        <text x="25" y="210" fill="#38bdf8" font-family="monospace" font-size="12">&gt; Verification: Hash SHA-256 Valid</text>
      </g>
    </g>
  </g>
</svg>
