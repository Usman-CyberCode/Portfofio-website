<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0a0815" />
      <stop offset="100%" stop-color="#040407" />
    </linearGradient>
    <linearGradient id="pV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="b" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#pBg)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Ambient glow -->
  <circle cx="600" cy="300" r="210" fill="url(#pV)" opacity="0.12" filter="url(#f)" />

  <!-- App Window -->
  <rect x="150" y="80" width="900" height="515" rx="16" fill="#07060f" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="150" y="80" width="900" height="46" rx="16" fill="#0d0a1b" />
  <circle cx="185" cy="103" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="207" cy="103" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="229" cy="103" r="6" fill="#10b981" opacity="0.8" />
  <text x="265" y="107" fill="#94a3b8" font-family="monospace" font-size="13">portfolio-showcase / next.js / page.tsx</text>
  <rect x="880" y="92" width="145" height="22" rx="11" fill="rgba(168,85,247,0.18)" stroke="rgba(168,85,247,0.35)" />
  <text x="898" y="107" fill="#d8b4fe" font-family="monospace" font-size="11">NEXT.js + MOTION</text>

  <!-- Editorial Hero Layout inside Mockup -->
  <g transform="translate(200, 160)">
    <rect x="290" y="10" width="180" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="305" cy="23" r="4" fill="#34d399" />
    <text x="318" y="27" fill="#e2e8f0" font-family="monospace" font-size="11">Available for work</text>

    <!-- Headline -->
    <text x="380" y="105" fill="#ebe8e5" font-family="sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1.5">FULL STACK</text>
    <text x="380" y="165" fill="#ebe8e5" font-family="sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1.5">DEVELOPER</text>
    <text x="380" y="205" fill="#ebe8e5" font-family="serif" font-style="italic" font-size="28" text-anchor="middle">with intention</text>

    <!-- Floating visual mocks -->
    <!-- Portrait circle mock -->
    <circle cx="160" cy="90" r="50" fill="#0f0c1c" stroke="rgba(168,85,247,0.4)" stroke-width="2" />
    <circle cx="160" cy="85" r="22" fill="#2d1c4d" />
    <path d="M 130 130 Q 160 100 190 130" fill="#1b1233" />

    <!-- Creative art mock -->
    <rect x="580" y="80" width="75" height="95" rx="12" fill="#0f0c1c" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" />
    <circle cx="617" cy="120" r="24" fill="url(#pV)" opacity="0.4" />

    <!-- Bottom Buttons -->
    <g transform="translate(250, 260)">
      <rect width="120" height="38" rx="19" fill="#ebe8e5" />
      <text x="60" y="24" fill="#000" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">View Works →</text>

      <rect x="135" width="120" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
      <text x="195" y="24" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">Let&apos;s talk</text>
    </g>

    <!-- Bio line -->
    <text x="380" y="340" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Muhammad Usman Tahir &bull; BSCS Student &bull; Web Developer</text>
  </g>
</svg>
