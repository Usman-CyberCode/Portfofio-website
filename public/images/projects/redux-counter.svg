<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="reduxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050713" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#030409" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#reduxBg)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Ambient glow -->
  <circle cx="600" cy="330" r="200" fill="url(#purpleGlow)" opacity="0.12" filter="url(#b)" />

  <!-- App Window -->
  <rect x="140" y="80" width="920" height="515" rx="16" fill="#090d1e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="140" y="80" width="920" height="46" rx="16" fill="#0d142c" />
  <circle cx="175" cy="103" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="197" cy="103" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="219" cy="103" r="6" fill="#10b981" opacity="0.8" />
  <text x="255" y="107" fill="#94a3b8" font-family="monospace" font-size="13">redux-counter / state-architecture / store.ts</text>
  <rect x="880" y="92" width="150" height="22" rx="11" fill="rgba(168,85,247,0.18)" stroke="rgba(168,85,247,0.35)" />
  <text x="898" y="107" fill="#d8b4fe" font-family="monospace" font-size="11">REDUX TOOLKIT</text>

  <!-- Central Counter Card -->
  <g transform="translate(420, 160)">
    <rect width="360" height="390" rx="16" fill="#0c1228" stroke="rgba(168,85,247,0.3)" stroke-width="1.5" />
    
    <text x="180" y="45" fill="#c4b5fd" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1.5">REACTIVE GLOBAL STATE</text>
    
    <!-- Big Counter Value Display -->
    <rect x="30" y="65" width="300" height="130" rx="12" fill="#070a16" stroke="rgba(255,255,255,0.06)" />
    <text x="180" y="150" fill="#ebe8e5" font-family="sans-serif" font-weight="800" font-size="64" text-anchor="middle">42</text>
    <text x="180" y="175" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">state.counter.value</text>

    <!-- Controls -->
    <g transform="translate(30, 220)">
      <!-- Decrement -->
      <rect width="85" height="50" rx="10" fill="#141c38" stroke="rgba(255,255,255,0.08)" />
      <text x="42" y="32" fill="#fff" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">-1</text>
      
      <!-- Reset -->
      <rect x="105" width="90" height="50" rx="10" fill="#141c38" stroke="rgba(255,255,255,0.08)" />
      <text x="150" y="31" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">RESET</text>

      <!-- Increment -->
      <rect x="215" width="85" height="50" rx="10" fill="rgba(168,85,247,0.25)" stroke="rgba(168,85,247,0.4)" />
      <text x="257" y="32" fill="#fff" font-family="sans-serif" font-weight="700" font-size="22" text-anchor="middle">+1</text>
    </g>

    <!-- Custom Step Controls -->
    <g transform="translate(30, 290)">
      <rect width="140" height="42" rx="8" fill="#101833" stroke="rgba(56,189,248,0.2)" />
      <text x="70" y="26" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">+5 by Amount</text>

      <rect x="160" width="140" height="42" rx="8" fill="#101833" stroke="rgba(168,85,247,0.2)" />
      <text x="230" y="26" fill="#c4b5fd" font-family="monospace" font-size="12" text-anchor="middle">Async Thunk</text>
    </g>

    <text x="180" y="365" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Pure Reducer &bull; Predictable Actions</text>
  </g>

  <!-- Left: Store Code Preview -->
  <g transform="translate(170, 160)">
    <rect width="220" height="390" rx="12" fill="#080c1c" stroke="rgba(255,255,255,0.05)" />
    <text x="16" y="28" fill="#a855f7" font-family="monospace" font-size="11">// store.ts</text>
    <text x="16" y="55" fill="#38bdf8" font-family="monospace" font-size="11">const counterSlice =</text>
    <text x="16" y="75" fill="#94a3b8" font-family="monospace" font-size="11">createSlice({</text>
    <text x="26" y="95" fill="#e2e8f0" font-family="monospace" font-size="11">name: &apos;counter&apos;,</text>
    <text x="26" y="115" fill="#e2e8f0" font-family="monospace" font-size="11">initialState: {</text>
    <text x="36" y="135" fill="#38bdf8" font-family="monospace" font-size="11">value: 0</text>
    <text x="26" y="155" fill="#e2e8f0" font-family="monospace" font-size="11">},</text>
    <text x="26" y="175" fill="#a855f7" font-family="monospace" font-size="11">reducers: {</text>
    <text x="36" y="195" fill="#34d399" font-family="monospace" font-size="11">increment: s =&gt; {</text>
    <text x="46" y="215" fill="#e2e8f0" font-family="monospace" font-size="11">s.value += 1</text>
    <text x="36" y="235" fill="#34d399" font-family="monospace" font-size="11">},</text>
    <text x="36" y="255" fill="#ef4444" font-family="monospace" font-size="11">decrement: s =&gt; {</text>
    <text x="46" y="275" fill="#e2e8f0" font-family="monospace" font-size="11">s.value -= 1</text>
    <text x="36" y="295" fill="#ef4444" font-family="monospace" font-size="11">}</text>
    <text x="26" y="315" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>
    <text x="16" y="335" fill="#94a3b8" font-family="monospace" font-size="11">});</text>
    <text x="16" y="365" fill="#38bdf8" font-family="monospace" font-size="10">✓ Dispatch: Synced</text>
  </g>

  <!-- Right: Dispatch Log -->
  <g transform="translate(810, 160)">
    <rect width="220" height="390" rx="12" fill="#080c1c" stroke="rgba(255,255,255,0.05)" />
    <text x="16" y="28" fill="#38bdf8" font-family="monospace" font-size="11">// Redux DevTools Log</text>
    <rect x="14" y="44" width="192" height="42" rx="6" fill="#0f162e" />
    <text x="24" y="62" fill="#c4b5fd" font-family="monospace" font-size="10">counter/increment</text>
    <text x="24" y="78" fill="#64748b" font-family="monospace" font-size="9">diff: { value: 42 }</text>

    <rect x="14" y="96" width="192" height="42" rx="6" fill="#0b1122" />
    <text x="24" y="114" fill="#94a3b8" font-family="monospace" font-size="10">counter/incrementBy</text>
    <text x="24" y="130" fill="#64748b" font-family="monospace" font-size="9">payload: 5</text>

    <rect x="14" y="148" width="192" height="42" rx="6" fill="#0b1122" />
    <text x="24" y="166" fill="#94a3b8" font-family="monospace" font-size="10">counter/decrement</text>
    <text x="24" y="182" fill="#64748b" font-family="monospace" font-size="9">diff: { value: 37 }</text>
  </g>
</svg>
