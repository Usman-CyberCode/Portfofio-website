<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#080c1d" />
      <stop offset="100%" stop-color="#04050a" />
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="b" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Ambient light orbs -->
  <circle cx="950" cy="200" r="180" fill="url(#violetGlow)" opacity="0.14" filter="url(#blur)" />
  <circle cx="220" cy="500" r="150" fill="#3b82f6" opacity="0.08" filter="url(#blur)" />

  <!-- Main Application Window Card -->
  <rect x="120" y="80" width="960" height="515" rx="16" fill="#090d1c" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="120" y="80" width="960" height="48" rx="16" fill="#0d1429" />
  <circle cx="155" cy="104" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="177" cy="104" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="199" cy="104" r="6" fill="#10b981" opacity="0.8" />
  <text x="240" y="108" fill="#94a3b8" font-family="monospace" font-size="13">workspace-manager / dashboard / active-projects</text>
  <rect x="940" y="93" width="110" height="22" rx="11" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" />
  <text x="965" y="108" fill="#c4b5fd" font-family="monospace" font-size="11">HACKATHON</text>

  <!-- App Sidebar -->
  <rect x="120" y="128" width="180" height="467" fill="#060914" opacity="0.6" />
  <rect x="145" y="160" width="130" height="32" rx="8" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.3)" />
  <text x="165" y="181" fill="#fff" font-family="sans-serif" font-weight="600" font-size="12">Workspaces</text>
  <rect x="145" y="205" width="130" height="28" rx="6" fill="rgba(255,255,255,0.02)" />
  <text x="165" y="223" fill="#64748b" font-family="sans-serif" font-size="12">Analytics</text>
  <rect x="145" y="245" width="130" height="28" rx="6" fill="rgba(255,255,255,0.02)" />
  <text x="165" y="263" fill="#64748b" font-family="sans-serif" font-size="12">Team Tasks</text>
  <rect x="145" y="285" width="130" height="28" rx="6" fill="rgba(255,255,255,0.02)" />
  <text x="165" y="303" fill="#64748b" font-family="sans-serif" font-size="12">Settings</text>

  <!-- Top Metrics Bar -->
  <g transform="translate(325, 155)">
    <rect width="220" height="75" rx="12" fill="#0c1224" stroke="rgba(255,255,255,0.06)" />
    <text x="18" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Workspaces</text>
    <text x="18" y="58" fill="#ebe8e5" font-family="sans-serif" font-weight="700" font-size="24">12 Active</text>

    <rect x="240" y="0" width="220" height="75" rx="12" fill="#0c1224" stroke="rgba(255,255,255,0.06)" />
    <text x="258" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Team Velocity</text>
    <text x="258" y="58" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="24">+94.6%</text>

    <rect x="480" y="0" width="245" height="75" rx="12" fill="#0c1224" stroke="rgba(139,92,246,0.25)" />
    <text x="498" y="28" fill="#c4b5fd" font-family="sans-serif" font-size="11">Hackathon Status</text>
    <text x="498" y="58" fill="#a855f7" font-family="sans-serif" font-weight="700" font-size="22">Completed</text>
  </g>

  <!-- Kanban / Column Layout -->
  <g transform="translate(325, 255)">
    <!-- Column 1 -->
    <rect width="225" height="305" rx="12" fill="#070a16" stroke="rgba(255,255,255,0.04)" />
    <text x="16" y="28" fill="#a1a1aa" font-family="monospace" font-size="12">QUEUED (4)</text>
    <rect x="14" y="44" width="197" height="70" rx="8" fill="#0f162c" stroke="rgba(255,255,255,0.05)" />
    <rect x="28" y="60" width="140" height="10" rx="4" fill="#cbd5e1" />
    <rect x="28" y="78" width="80" height="8" rx="4" fill="#64748b" />
    <rect x="28" y="93" width="50" height="12" rx="6" fill="rgba(139,92,246,0.2)" />

    <rect x="14" y="124" width="197" height="70" rx="8" fill="#0f162c" stroke="rgba(255,255,255,0.05)" />
    <rect x="28" y="140" width="120" height="10" rx="4" fill="#cbd5e1" />
    <rect x="28" y="158" width="90" height="8" rx="4" fill="#64748b" />

    <!-- Column 2 -->
    <rect x="245" width="225" height="305" rx="12" fill="#070a16" stroke="rgba(139,92,246,0.15)" />
    <text x="261" y="28" fill="#c4b5fd" font-family="monospace" font-size="12">IN PROGRESS (3)</text>
    <rect x="259" y="44" width="197" height="80" rx="8" fill="#131b36" stroke="rgba(139,92,246,0.3)" />
    <rect x="273" y="60" width="160" height="10" rx="4" fill="#fff" />
    <rect x="273" y="78" width="110" height="8" rx="4" fill="#94a3b8" />
    <rect x="273" y="96" width="70" height="16" rx="8" fill="rgba(56,189,248,0.2)" />
    <text x="283" y="108" fill="#38bdf8" font-family="monospace" font-size="9">UI LAYOUT</text>

    <!-- Column 3 -->
    <rect x="490" width="235" height="305" rx="12" fill="#070a16" stroke="rgba(16,185,129,0.15)" />
    <text x="506" y="28" fill="#6ee7b7" font-family="monospace" font-size="12">COMPLETED (8)</text>
    <rect x="504" y="44" width="207" height="70" rx="8" fill="#0c1924" stroke="rgba(16,185,129,0.2)" />
    <rect x="518" y="60" width="140" height="10" rx="4" fill="#a7f3d0" />
    <rect x="518" y="78" width="100" height="8" rx="4" fill="#34d399" />
    <rect x="518" y="94" width="60" height="12" rx="6" fill="rgba(16,185,129,0.2)" />
  </g>
</svg>
