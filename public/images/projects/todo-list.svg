<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="bl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#todoBg)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <circle cx="600" cy="300" r="200" fill="url(#cyanGrad)" opacity="0.1" filter="url(#bl)" />

  <!-- App Window -->
  <rect x="200" y="80" width="800" height="515" rx="16" fill="#070c1a" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="200" y="80" width="800" height="46" rx="16" fill="#0d152a" />
  <circle cx="235" cy="103" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="257" cy="103" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="279" cy="103" r="6" fill="#10b981" opacity="0.8" />
  <text x="310" y="107" fill="#94a3b8" font-family="monospace" font-size="13">todo-app / interactive-task-manager / index.html</text>
  <rect x="850" y="92" width="125" height="22" rx="11" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)" />
  <text x="868" y="107" fill="#67e8f9" font-family="monospace" font-size="11">JAVASCRIPT</text>

  <!-- Input Field -->
  <g transform="translate(260, 160)">
    <rect width="680" height="48" rx="12" fill="#0a1224" stroke="rgba(6,182,212,0.3)" />
    <text x="20" y="29" fill="#94a3b8" font-family="sans-serif" font-size="14">What tasks are we accomplishing today?</text>
    <rect x="580" y="6" width="90" height="36" rx="8" fill="#0284c7" />
    <text x="625" y="29" fill="#fff" font-family="sans-serif" font-weight="600" font-size="13" text-anchor="middle">+ Add</text>

    <!-- Filter Pills -->
    <g transform="translate(0, 68)">
      <rect width="60" height="28" rx="14" fill="rgba(6,182,212,0.2)" stroke="rgba(6,182,212,0.4)" />
      <text x="30" y="18" fill="#67e8f9" font-family="monospace" font-size="11" text-anchor="middle">All (6)</text>

      <rect x="70" width="75" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="107" y="18" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Active (3)</text>

      <rect x="155" width="95" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
      <text x="202" y="18" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Completed (3)</text>
    </g>

    <!-- Task Items -->
    <g transform="translate(0, 115)">
      <!-- Item 1 Completed -->
      <rect width="680" height="52" rx="10" fill="#091122" stroke="rgba(255,255,255,0.04)" />
      <circle cx="30" cy="26" r="10" fill="#10b981" />
      <path d="M 26 26 L 29 29 L 35 23" stroke="#fff" stroke-width="2" fill="none" />
      <text x="54" y="31" fill="#64748b" font-family="sans-serif" font-size="14" text-decoration="line-through">Study C++ Graph Traversals (BFS &amp; DFS)</text>
      <rect x="580" y="14" width="85" height="24" rx="12" fill="rgba(16,185,129,0.15)" />
      <text x="622" y="30" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">COMPLETED</text>

      <!-- Item 2 Active -->
      <g transform="translate(0, 62)">
        <rect width="680" height="52" rx="10" fill="#0e1832" stroke="rgba(6,182,212,0.3)" />
        <circle cx="30" cy="26" r="10" fill="none" stroke="#67e8f9" stroke-width="2" />
        <text x="54" y="31" fill="#fff" font-family="sans-serif" font-weight="500" font-size="14">Build Workspace Manager project component tree</text>
        <rect x="580" y="14" width="85" height="24" rx="12" fill="rgba(6,182,212,0.15)" />
        <text x="622" y="30" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">IN PROGRESS</text>
      </g>

      <!-- Item 3 Active -->
      <g transform="translate(0, 124)">
        <rect width="680" height="52" rx="10" fill="#091122" stroke="rgba(255,255,255,0.04)" />
        <circle cx="30" cy="26" r="10" fill="none" stroke="#64748b" stroke-width="2" />
        <text x="54" y="31" fill="#cbd5e1" font-family="sans-serif" font-size="14">Implement Redux state counter and async actions</text>
        <rect x="580" y="14" width="85" height="24" rx="12" fill="rgba(139,92,246,0.15)" />
        <text x="622" y="30" fill="#c4b5fd" font-family="monospace" font-size="10" text-anchor="middle">UPCOMING</text>
      </g>
    </g>
  </g>
</svg>
