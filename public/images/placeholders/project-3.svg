<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111116" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect x="50" y="50" width="700" height="350" rx="12" fill="#14141d" stroke="rgba(255,255,255,0.06)" />
  <!-- Storefront Grid Mockup -->
  <rect x="100" y="90" width="160" height="180" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <rect x="290" y="90" width="160" height="180" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <rect x="480" y="90" width="220" height="180" rx="8" fill="rgba(239,68,68,0.08)" stroke="url(#redGrad)" />
  <text x="400" y="360" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="1.5">
    [E-COMMERCE &amp; CHECKOUT FLOW]
  </text>
</svg>
