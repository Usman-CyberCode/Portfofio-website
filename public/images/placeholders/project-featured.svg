<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Glowing orb -->
  <circle cx="850" cy="280" r="160" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Abstract UI Mockup Card -->
  <rect x="220" y="140" width="760" height="420" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="220" y="140" width="760" height="48" rx="16" fill="#181822" />
  <circle cx="255" cy="164" r="6" fill="#ef4444" opacity="0.7" />
  <circle cx="275" cy="164" r="6" fill="#f59e0b" opacity="0.7" />
  <circle cx="295" cy="164" r="6" fill="#10b981" opacity="0.7" />
  <rect x="350" y="154" width="280" height="20" rx="6" fill="rgba(255,255,255,0.05)" />

  <!-- Code / UI Wireframe -->
  <rect x="260" y="220" width="220" height="120" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" />
  <rect x="510" y="220" width="430" height="40" rx="6" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" />
  <rect x="510" y="275" width="380" height="24" rx="4" fill="rgba(255,255,255,0.04)" />
  <rect x="510" y="315" width="290" height="24" rx="4" fill="rgba(255,255,255,0.04)" />
  
  <rect x="260" y="370" width="680" height="150" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" />
  
  <!-- Tag label -->
  <text x="600" y="580" fill="#f97316" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">
    [FEATURED PROJECT PREVIEW]
  </text>
</svg>
